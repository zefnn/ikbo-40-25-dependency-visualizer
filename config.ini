; Конфигурация визуализатора графа зависимостей pip-пакетов.
; Все параметры обязательны, пустым может быть только filter_substring.
[settings]
; Имя анализируемого пакета.
package_name = requests
; URL-адрес репозитория (при test_mode = true - путь к файлу).
repository = https://pypi.org/pypi
; Режим работы с тестовым репозиторием: true или false.
test_mode = false
; Версия пакета в формате PEP 440.
version = 2.32.3
; Имя PNG-файла, в который будет сохранено изображение графа.
output_image = graph.png
; Вывод зависимостей в виде ASCII-дерева: true или false.
ascii_tree = false
; Пакеты, имя которых содержит эту подстроку, не учитываются.
filter_substring =
; Вывод обратных зависимостей (только при test_mode = true).
reverse_dependencies = false
